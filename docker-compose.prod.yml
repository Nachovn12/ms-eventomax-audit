services:
  audit:
    build:
      context: .
    container_name: eventomax-audit-prod
    mem_limit: 512m
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: ${DB_SCHEMA:-audit}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-audit}
      SPRING_FLYWAY_SCHEMAS: ${DB_SCHEMA:-audit}
      SPRING_FLYWAY_CREATE_SCHEMAS: ${FLYWAY_CREATE_SCHEMAS:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      AUDIT_KAFKA_ENABLED: ${AUDIT_KAFKA_ENABLED:-false}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:?Set the approved Entra issuer URI}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Set the approved API audience}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      eventomax-net:
        aliases:
          - ms-eventomax-audit

networks:
  eventomax-net:
    external: true
