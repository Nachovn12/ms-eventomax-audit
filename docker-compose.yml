services:
  postgres:
    image: postgres:17
    container_name: eventomax-audit-db
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventomax_audit}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit:
    build:
      context: .
    container_name: eventomax-audit-app
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eventomax_audit}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AUDIT_KAFKA_ENABLED: ${AUDIT_KAFKA_ENABLED:-false}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:?Set the approved Entra issuer URI}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Set the approved API audience}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
