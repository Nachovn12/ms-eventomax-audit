spring:
  application:
    name: ms-eventomax-audit

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: cl.duoc.eventomax.audit.dto.KafkaEventEnvelope
        spring.json.use.type.headers: false
        spring.json.trusted.packages: cl.duoc.eventomax.audit.dto
    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}

eventomax:
  security:
    jwt:
      audience: ${ENTRA_AUDIENCE}
  graph:
    enabled: ${EVENTOMAX_GRAPH_ENABLED:false}
    tenant-id: ${EVENTOMAX_GRAPH_TENANT_ID:}
    client-id: ${EVENTOMAX_GRAPH_CLIENT_ID:}
    client-secret: ${EVENTOMAX_GRAPH_CLIENT_SECRET:}
    token-base-url: ${EVENTOMAX_GRAPH_TOKEN_BASE_URL:https://login.microsoftonline.com}
    graph-base-url: ${EVENTOMAX_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
    cache-ttl: ${EVENTOMAX_GRAPH_CACHE_TTL:10m}
    not-found-cache-ttl: ${EVENTOMAX_GRAPH_NOT_FOUND_CACHE_TTL:2m}
    connect-timeout: ${EVENTOMAX_GRAPH_CONNECT_TIMEOUT:3s}
    read-timeout: ${EVENTOMAX_GRAPH_READ_TIMEOUT:5s}
  audit:
    kafka:
      # Kafka consumer for productions.events and audit.timeline (disabled in isolated local/PG tests)
      enabled: ${AUDIT_KAFKA_ENABLED:false}
      topic: ${AUDIT_KAFKA_TOPIC:productions.events}
      timeline-topic: ${AUDIT_KAFKA_TIMELINE_TOPIC:audit.timeline}
      group-id: ${AUDIT_KAFKA_GROUP_ID:audit-group}
      timeline-group-id: ${AUDIT_KAFKA_TIMELINE_GROUP_ID:audit-timeline-group}
      auto-create-topics: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never
